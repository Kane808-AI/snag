<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="dark">
<title>Snag — Vault</title>
<style>
  :root {
    color-scheme: dark;
    --bg: #0d0e12;
    --surface: #121419;
    --surface-raised: #171a21;
    --surface-hover: #1b1f27;
    --surface-soft: #101217;
    --text: #e6e9ef;
    --text-strong: #f4f6fa;
    --muted: #8b93a1;
    --muted-strong: #aeb6c5;
    --border: #252a34;
    --border-subtle: #1c2028;
    --border-strong: #343b49;
    --accent: #90a8cc;
    --accent-bright: #b0c5e5;
    --accent-soft: rgba(144, 168, 204, .12);
    --accent-line: rgba(144, 168, 204, .32);
    --green: #8dc9a5;
    --green-soft: rgba(141, 201, 165, .12);
    --amber: #d9b87e;
    --amber-soft: rgba(217, 184, 126, .12);
    --slate: #a3adbd;
    --slate-soft: rgba(163, 173, 189, .12);
    --shadow: 0 18px 48px rgba(0, 0, 0, .22);
  }

  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0;
    min-width: 0;
    height: 100%;
    height: 100dvh;
    overflow: hidden;
    background: var(--bg);
    color: var(--text);
    font: 15px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    -webkit-font-smoothing: antialiased;
    text-rendering: optimizeLegibility;
  }

  button, input { font: inherit; }
  button, a { -webkit-tap-highlight-color: transparent; }
  button { color: inherit; }
  a:focus-visible, button:focus-visible, input:focus-visible, summary:focus-visible {
    outline: 2px solid var(--accent-bright);
    outline-offset: 3px;
  }
  ::selection { background: var(--accent-soft); color: var(--text-strong); }

  .topbar {
    position: relative;
    z-index: 2;
    flex: none;
    padding: 20px 24px 16px;
    border-bottom: 1px solid var(--border);
    background: var(--bg);
  }
  .topbar-inner { max-width: 1440px; margin: 0 auto; }
  .brand-row { display: flex; align-items: center; justify-content: space-between; gap: 16px; }
  .brand { display: flex; align-items: center; gap: 10px; min-width: 0; }
  .brand-mark {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    width: 28px;
    height: 28px;
    border: 1px solid var(--accent-line);
    border-radius: 8px;
    color: var(--accent-bright);
    background: var(--accent-soft);
  }
  .brand-mark svg { width: 15px; height: 15px; }
  .brand-copy { display: grid; gap: 1px; min-width: 0; }
  .eyebrow {
    margin: 0;
    color: var(--muted);
    font-size: 10px;
    font-weight: 700;
    letter-spacing: .13em;
    line-height: 1.3;
    text-transform: uppercase;
  }
  h1 {
    margin: 0;
    color: var(--text-strong);
    font-size: 17px;
    font-weight: 650;
    letter-spacing: -.02em;
    line-height: 1.15;
  }
  #stats {
    flex: none;
    color: var(--muted);
    font-size: 12px;
    white-space: nowrap;
  }

  .toolbar { display: grid; grid-template-columns: minmax(0, 1fr) auto; align-items: center; gap: 12px; margin-top: 18px; }
  .search-wrap { position: relative; min-width: 0; }
  .search-icon {
    position: absolute;
    top: 50%;
    left: 12px;
    display: inline-flex;
    color: var(--muted);
    pointer-events: none;
    transform: translateY(-50%);
  }
  .search-icon svg { width: 16px; height: 16px; }
  #search {
    width: 100%;
    min-width: 0;
    padding: 10px 38px 10px 38px;
    border: 1px solid var(--border);
    border-radius: 9px;
    outline: 0;
    background: var(--surface);
    color: var(--text);
    font-size: 14px;
    transition: border-color .16s ease, box-shadow .16s ease, background .16s ease;
  }
  #search:hover { background: var(--surface-raised); }
  #search:focus { border-color: var(--accent-line); box-shadow: 0 0 0 3px var(--accent-soft); background: var(--surface-raised); }
  #search::placeholder { color: #747d8c; }
  #search::-webkit-search-cancel-button { -webkit-appearance: none; appearance: none; }
  .search-clear {
    position: absolute;
    top: 50%;
    right: 8px;
    display: none;
    width: 24px;
    height: 24px;
    padding: 0;
    border: 0;
    border-radius: 6px;
    background: transparent;
    color: var(--muted);
    cursor: pointer;
    transform: translateY(-50%);
  }
  .search-clear.show { display: inline-flex; align-items: center; justify-content: center; }
  .search-clear:hover { background: var(--surface-hover); color: var(--text); }
  .shortcut { color: var(--muted); font-size: 11px; white-space: nowrap; }
  .shortcut kbd {
    padding: 3px 6px;
    border: 1px solid var(--border);
    border-bottom-color: var(--border-strong);
    border-radius: 5px;
    background: var(--surface);
    font: inherit;
  }

  .filters { display: flex; flex-wrap: wrap; gap: 7px; margin-top: 12px; }
  .chip {
    padding: 5px 11px;
    border: 1px solid var(--border);
    border-radius: 999px;
    background: transparent;
    color: var(--muted);
    cursor: pointer;
    font-size: 12px;
    font-weight: 600;
    line-height: 1.25;
    transition: border-color .16s ease, background .16s ease, color .16s ease;
  }
  .chip:hover { border-color: var(--border-strong); background: var(--surface-raised); color: var(--text); }
  .chip.active { border-color: var(--accent-line); background: var(--accent-soft); color: var(--accent-bright); }

  .app {
    display: grid;
    grid-template-columns: minmax(330px, 400px) minmax(0, 1fr);
    flex: 1;
    min-height: 0;
    max-width: 1440px;
    width: 100%;
    margin: 0 auto;
  }
  .list-pane,
  .detail-pane {
    min-width: 0;
    min-height: 0;
    overflow-y: auto;
    scrollbar-color: var(--border-strong) transparent;
    scrollbar-width: thin;
  }
  .list-pane { border-right: 1px solid var(--border); }
  .detail-pane { position: sticky; top: 0; height: 100%; }
  .list-pane::-webkit-scrollbar, .detail-pane::-webkit-scrollbar { width: 10px; }
  .list-pane::-webkit-scrollbar-thumb, .detail-pane::-webkit-scrollbar-thumb { border: 3px solid var(--bg); border-radius: 8px; background: var(--border-strong); }
  .list-pane::-webkit-scrollbar-track, .detail-pane::-webkit-scrollbar-track { background: transparent; }

  .list-head {
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    gap: 12px;
    padding: 17px 20px 11px;
  }
  .list-title { margin: 0; color: var(--text-strong); font-size: 12px; font-weight: 700; letter-spacing: .1em; text-transform: uppercase; }
  .list-count { color: var(--muted); font-size: 12px; white-space: nowrap; }

  .item {
    position: relative;
    display: block;
    width: 100%;
    padding: 15px 20px 16px;
    border: 0;
    border-top: 1px solid var(--border-subtle);
    background: transparent;
    color: var(--text);
    cursor: pointer;
    text-align: left;
    transition: background .16s ease, border-color .16s ease;
  }
  .item:last-child { border-bottom: 1px solid var(--border-subtle); }
  .item:hover { background: var(--surface); }
  .item:active, .item.active { background: var(--surface-raised); }
  .item.active::before {
    position: absolute;
    top: 0;
    bottom: 0;
    left: 0;
    width: 2px;
    background: var(--accent);
    content: "";
  }
  .item-main { display: flex; align-items: flex-start; justify-content: space-between; gap: 14px; min-width: 0; }
  .item-summary {
    min-width: 0;
    color: var(--text-strong);
    font-size: 15px;
    font-weight: 650;
    letter-spacing: -.012em;
    line-height: 1.4;
    overflow-wrap: anywhere;
  }
  .item-impact { flex: none; padding-top: 5px; }
  .item-meta { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; margin-top: 9px; }
  .badge {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    max-width: 100%;
    padding: 3px 8px;
    border-radius: 6px;
    font-size: 11px;
    font-weight: 650;
    letter-spacing: .015em;
    line-height: 1.3;
    overflow-wrap: anywhere;
  }
  .badge.neutral { background: var(--surface-raised); color: var(--muted-strong); }
  .stage-act { background: var(--green-soft); color: var(--green); }
  .stage-ref { background: var(--amber-soft); color: var(--amber); }
  .stage-inbox { background: var(--slate-soft); color: var(--slate); }
  .stage-other { background: var(--surface-raised); color: var(--muted); }
  .status-done { background: var(--green-soft); color: var(--green); }
  .status-progress { background: var(--accent-soft); color: var(--accent-bright); }
  .status-inbox, .status-archived { background: var(--surface-raised); color: var(--muted); }
  .status-dot { width: 5px; height: 5px; border-radius: 50%; background: currentColor; }

  .tags { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 9px; }
  .tag {
    max-width: 100%;
    padding: 2px 8px;
    border: 1px solid rgba(144, 168, 204, .2);
    border-radius: 999px;
    background: var(--accent-soft);
    color: var(--accent);
    font-size: 11.5px;
    font-weight: 550;
    line-height: 1.35;
    overflow-wrap: anywhere;
  }

  .dots { display: inline-flex; gap: 3px; align-items: center; }
  .dot { width: 6px; height: 6px; border: 1px solid var(--border-strong); border-radius: 50%; background: var(--surface-raised); }
  .dot.on { border-color: var(--accent); background: var(--accent); }
  .dots-effort .dot.on { border-color: var(--slate); background: var(--slate); }
  .scales { display: flex; flex-wrap: wrap; gap: 12px 24px; margin-top: 18px; }
  .scale { display: inline-flex; align-items: center; gap: 9px; }
  .scale-label { color: var(--muted); font-size: 10px; font-weight: 700; letter-spacing: .1em; text-transform: uppercase; }

  #detail { max-width: 780px; margin: 0 auto; padding: 30px 52px 76px; }
  .back {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    margin: 0 0 28px;
    padding: 6px 10px 6px 7px;
    border: 1px solid var(--border);
    border-radius: 7px;
    background: transparent;
    color: var(--muted);
    cursor: pointer;
    font-size: 12px;
    font-weight: 600;
    transition: border-color .16s ease, background .16s ease, color .16s ease;
  }
  .back:hover { border-color: var(--border-strong); background: var(--surface); color: var(--text); }
  .back svg { width: 14px; height: 14px; }
  .detail-head { padding-bottom: 25px; border-bottom: 1px solid var(--border); }
  .detail-kicker { margin: 0 0 9px; color: var(--muted); font-size: 11px; font-weight: 700; letter-spacing: .11em; text-transform: uppercase; }
  #detail h2 { margin: 0; color: var(--text-strong); font-size: clamp(20px, 2.2vw, 27px); font-weight: 650; letter-spacing: -.025em; line-height: 1.25; overflow-wrap: anywhere; }
  .detail-head .item-meta { margin-top: 15px; }
  .detail-head .tags { margin-top: 14px; }
  .detail-foot { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 16px; margin-top: 18px; color: var(--muted); font-size: 12px; }
  .detail-foot > span { display: inline-flex; align-items: center; gap: 6px; }
  .detail-foot > span::before { width: 4px; height: 4px; border-radius: 50%; background: var(--border-strong); content: ""; }
  .source { display: inline-flex; align-items: center; gap: 6px; max-width: 100%; color: var(--accent-bright); font-weight: 600; overflow-wrap: anywhere; text-decoration: none; }
  .source:hover { text-decoration: underline; text-underline-offset: 3px; }
  .source svg { width: 13px; height: 13px; }
  .block { padding: 24px 0; border-bottom: 1px solid var(--border-subtle); }
  .block h3 { margin: 0 0 8px; color: var(--muted); font-size: 10px; font-weight: 750; letter-spacing: .13em; text-transform: uppercase; }
  .note { margin: 0; color: var(--text); font-size: 14px; line-height: 1.7; overflow-wrap: anywhere; white-space: pre-wrap; }
  details.transcript { margin-top: 24px; border: 1px solid var(--border); border-radius: 9px; background: var(--surface-soft); overflow: hidden; }
  details.transcript summary { padding: 12px 14px; color: var(--muted-strong); cursor: pointer; font-size: 11px; font-weight: 700; letter-spacing: .09em; text-transform: uppercase; user-select: none; }
  details.transcript summary:hover { color: var(--text); }
  details.transcript pre { margin: 0; padding: 0 14px 15px; color: var(--muted-strong); font: inherit; font-size: 13px; line-height: 1.65; overflow-wrap: anywhere; white-space: pre-wrap; }

  .empty { display: flex; min-height: 280px; flex-direction: column; align-items: center; justify-content: center; padding: 52px 24px; color: var(--muted); text-align: center; }
  .detail-pane .empty { height: 100%; min-height: 100%; }
  .empty-mark { display: inline-flex; align-items: center; justify-content: center; width: 48px; height: 48px; margin-bottom: 16px; border: 1px solid var(--border); border-radius: 14px; background: var(--surface); color: var(--accent); box-shadow: var(--shadow); }
  .empty-mark svg { width: 20px; height: 20px; }
  .empty-title { margin: 0 0 5px; color: var(--text-strong); font-size: 15px; font-weight: 650; }
  .empty-sub { max-width: 300px; margin: 0; font-size: 13px; line-height: 1.55; }
  .empty-action { margin-top: 17px; padding: 7px 12px; border: 1px solid var(--accent-line); border-radius: 7px; background: transparent; color: var(--accent-bright); cursor: pointer; font-size: 12px; font-weight: 650; }
  .empty-action:hover { background: var(--accent-soft); }

  @media (max-width: 899.98px) {
    body { overflow: hidden; }
    .topbar { padding: 15px 16px 13px; }
    .toolbar { display: block; margin-top: 15px; }
    .shortcut { display: none; }
    .filters { margin-top: 10px; overflow-x: auto; flex-wrap: nowrap; padding-bottom: 2px; scrollbar-width: none; }
    .filters::-webkit-scrollbar { display: none; }
    .chip { flex: none; }
    .app { display: block; }
    .list-pane { border-right: 0; }
    .detail-pane { display: none; position: static; height: 100%; }
    body.detail-open .list-pane { display: none; }
    body.detail-open .detail-pane { display: block; }
    .list-head { padding: 15px 16px 10px; }
    .item { padding: 14px 16px 15px; }
    #detail { padding: 20px 16px 58px; }
    .back { margin-bottom: 24px; }
  }
  @media (max-width: 420px) {
    #stats { display: none; }
    .brand-row { gap: 8px; }
    .item-main { gap: 9px; }
    .item-summary { font-size: 14px; }
    .scales { gap: 10px 18px; }
  }
  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation-duration: .01ms !important; animation-iteration-count: 1 !important; scroll-behavior: auto !important; transition-duration: .01ms !important; }
  }
</style>
</head>
<body>
  <header class="topbar">
    <div class="topbar-inner">
      <div class="brand-row">
        <div class="brand">
          <span class="brand-mark" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M6.5 3.5h11a1 1 0 0 1 1 1V21l-5.5-3.4L7 21V4.5a1 1 0 0 1 1-1z"/></svg></span>
          <span class="brand-copy"><span class="eyebrow">Personal vault</span><h1>Snag</h1></span>
        </div>
        <span id="stats" aria-live="polite"></span>
      </div>
      <div class="toolbar">
        <div class="search-wrap">
          <span class="search-icon" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"><circle cx="10.8" cy="10.8" r="6.8"/><path d="m16 16 5 5"/></svg></span>
          <input id="search" type="search" placeholder="Search your saves" autocomplete="off" spellcheck="false" aria-label="Search your saves">
          <button id="clearSearch" class="search-clear" type="button" aria-label="Clear search"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"><path d="m6 6 12 12M18 6 6 18"/></svg></button>
        </div>
        <span class="shortcut"><kbd>/</kbd> to search</span>
      </div>
      <nav class="filters" id="stageChips" aria-label="Filter by stage"></nav>
    </div>
  </header>

  <div class="app">
    <aside class="list-pane" id="listPane">
      <div class="list-head"><h2 class="list-title">Library</h2><span id="listCount" class="list-count" aria-live="polite"></span></div>
      <main id="list"></main>
    </aside>
    <section class="detail-pane" id="detailPane" aria-label="Selected save">
      <div id="idleState" class="empty">
        <div class="empty-mark" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M6.5 3.5h11a1 1 0 0 1 1 1V21l-5.5-3.4L7 21V4.5a1 1 0 0 1 1-1z"/></svg></div>
        <p class="empty-title">Select a save to read it</p>
        <p class="empty-sub">Your notes, next steps, and source transcript will appear here.</p>
      </div>
      <article id="detail" hidden></article>
    </section>
  </div>

<script>
const $ = selector => document.querySelector(selector);
const state = { q: "", stage: null, items: [], tags: [], lastId: null };

// All vault-derived strings pass through this helper before entering HTML.
const esc = value => String(value ?? "").replace(/[&<>"']/g, char => ({
  "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"
}[char]));

const STAGES = ["Worth Acting On", "Reference", "Inbox"];
const STAGE_CLS = { "Worth Acting On": "act", "Reference": "ref", "Inbox": "inbox" };
const isWide = () => window.matchMedia("(min-width: 900px)").matches;

const SVG = {
  bookmark: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6.5 3.5h11a1 1 0 0 1 1 1V21l-5.5-3.4L7 21V4.5a1 1 0 0 1 1-1z"/></svg>',
  back: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m15 18-6-6 6-6"/></svg>',
  ext: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M14 4h6v6"/><path d="m20 4-9.5 9.5"/><path d="M19 13.5V19a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1V6a1 1 0 0 1 1-1h5.5"/></svg>',
  search: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"><circle cx="10.8" cy="10.8" r="6.8"/><path d="m16 16 5 5"/></svg>'
};

function stageBadge(stage) {
  const value = stage || "Inbox";
  return `<span class="badge stage-${STAGE_CLS[value] || "other"}">${esc(value)}</span>`;
}

function statusBadge(status) {
  const value = status || "inbox";
  const key = String(value).toLowerCase().replace(/\s+/g, "-");
  const color = { done: "done", "in-progress": "progress", archived: "archived" }[key] || "inbox";
  return `<span class="badge status-${color}"><span class="status-dot" aria-hidden="true"></span>${esc(value)}</span>`;
}

function tagsList(tags) {
  return String(tags || "").split(",").filter(tag => tag.trim()).map(tag => `<span class="tag">#${esc(tag.trim())}</span>`).join("");
}

function hasTags(tags) {
  return String(tags || "").split(",").some(tag => tag.trim());
}

function safeUrl(value) {
  const url = String(value || "").trim();
  return /^https?:\/\//i.test(url) ? url : "";
}

function sourceLabel(url) {
  try { return new URL(url).hostname.replace(/^www\./i, ""); } catch (_) { return "Open source"; }
}

function dots(value) {
  const amount = Math.max(0, Math.min(5, parseInt(value, 10) || 0));
  let html = "";
  for (let index = 1; index <= 5; index += 1) html += `<span class="dot${index <= amount ? " on" : ""}"></span>`;
  return html;
}

function scale(label, value, effort) {
  const amount = Math.max(0, Math.min(5, parseInt(value, 10) || 0));
  return `<span class="scale"><span class="scale-label">${esc(label)}</span><span class="dots${effort ? " dots-effort" : ""}" role="img" aria-label="${esc(label)} ${esc(amount)} of 5">${dots(amount)}</span></span>`;
}

function emptyStateHTML() {
  if (state.q || state.stage) {
    const query = state.q ? ` for “${esc(state.q)}”` : "";
    return `<div class="empty"><div class="empty-mark" aria-hidden="true">${SVG.search}</div><p class="empty-title">No matches${query}</p><p class="empty-sub">Try another search, or clear the filters to see your full library.</p><button class="empty-action" id="clearFilters" type="button">Clear search and filters</button></div>`;
  }
  return `<div class="empty"><div class="empty-mark" aria-hidden="true">${SVG.bookmark}</div><p class="empty-title">Your library is quiet</p><p class="empty-sub">Save a link in Telegram and the note will appear here.</p></div>`;
}

function renderList() {
  const list = $("#list");
  $("#listCount").textContent = `${state.items.length} ${state.items.length === 1 ? "save" : "saves"}`;
  if (!state.items.length) {
    list.innerHTML = emptyStateHTML();
    return;
  }
  list.innerHTML = state.items.map(item => `
    <button class="item" type="button" data-id="${esc(String(item.id))}">
      <div class="item-main">
        <span class="item-summary">${esc(item.summary || "(no summary)")}</span>
        <span class="item-impact" role="img" aria-label="Impact ${esc(parseInt(item.impact, 10) || 0)} of 5" title="Impact ${esc(parseInt(item.impact, 10) || 0)}/5">${dots(item.impact)}</span>
      </div>
      <div class="item-meta">${stageBadge(item.stage)}${statusBadge(item.status)}${item.action_type ? `<span class="badge neutral">${esc(item.action_type)}</span>` : ""}</div>
      ${hasTags(item.tags) ? `<div class="tags">${tagsList(item.tags)}</div>` : ""}
    </button>`).join("");
  setActive(state.lastId);
}

function setActive(id) {
  document.querySelectorAll("#list .item").forEach(button => button.classList.toggle("active", id != null && String(button.dataset.id) === String(id)));
}

async function loadItems() {
  try {
    const params = new URLSearchParams();
    if (state.q) params.set("q", state.q);
    if (state.stage) params.set("stage", state.stage);
    const query = params.toString();
    const response = await fetch(`/api/items${query ? `?${query}` : ""}`);
    const data = await response.json();
    state.items = Array.isArray(data.items) ? data.items : [];
    renderList();
  } catch (_) {
    $("#listCount").textContent = "";
    $("#list").innerHTML = `<div class="empty"><div class="empty-mark" aria-hidden="true">${SVG.bookmark}</div><p class="empty-title">Vault unavailable</p><p class="empty-sub">The local server did not respond. Refresh to try again.</p></div>`;
  }
  loadStats();
}

async function loadStats() {
  try {
    const response = await fetch("/api/stats");
    const stats = await response.json();
    const acting = stats.by_stage && stats.by_stage["Worth Acting On"] || 0;
    $("#stats").textContent = `${stats.total || 0} saved · ${acting} worth acting on`;
  } catch (_) { /* Stats are auxiliary. The library remains usable without them. */ }
}

async function loadTags() {
  try {
    const response = await fetch("/api/tags");
    const data = await response.json();
    state.tags = Array.isArray(data.tags) ? data.tags : [];
  } catch (_) { state.tags = []; }
}

function renderDetail(item) {
  const detail = $("#detail");
  const timestamp = Number(item.ts);
  const date = timestamp ? new Date(timestamp * 1000).toLocaleDateString(undefined, { year: "numeric", month: "short", day: "numeric" }) : "";
  const source = safeUrl(item.source_url);
  detail.innerHTML = `
    <button id="back" class="back" type="button">${SVG.back}<span>Back to library</span></button>
    <header class="detail-head">
      <p class="detail-kicker">Captured note</p>
      <h2>${esc(item.summary || "(no summary)")}</h2>
      <div class="item-meta">${stageBadge(item.stage)}${statusBadge(item.status)}${item.action_type ? `<span class="badge neutral">${esc(item.action_type)}</span>` : ""}${item.content_type ? `<span class="badge neutral">${esc(item.content_type)}</span>` : ""}</div>
      <div class="scales">${scale("Impact", item.impact, false)}${scale("Effort", item.effort, true)}</div>
      ${hasTags(item.tags) ? `<div class="tags">${tagsList(item.tags)}</div>` : ""}
      <div class="detail-foot">${date ? `<span>${esc(date)}</span>` : ""}${source ? `<a class="source" href="${esc(source)}" target="_blank" rel="noopener">${esc(sourceLabel(source))}${SVG.ext}</a>` : ""}</div>
    </header>
    <section class="block"><h3>Key Ideas</h3><p class="note">${esc(item.key_ideas || "")}</p></section>
    <section class="block"><h3>Why It Matters</h3><p class="note">${esc(item.why_it_matters || "")}</p></section>
    <section class="block"><h3>Recommendations</h3><p class="note">${esc(item.recommendations || "")}</p></section>
    ${item.transcript ? `<details class="transcript"><summary>Transcript / full text</summary><pre>${esc(item.transcript)}</pre></details>` : ""}`;
  $("#back").onclick = closeDetail;
}

async function openItem(id) {
  try {
    const response = await fetch(`/api/items/${encodeURIComponent(id)}`);
    if (!response.ok) return;
    const item = await response.json();
    state.lastId = String(id);
    $("#idleState").style.display = "none";
    $("#detail").hidden = false;
    renderDetail(item);
    setActive(id);
    $("#detailPane").scrollTop = 0;
    if (!isWide()) {
      document.body.classList.add("detail-open");
      $("#back").focus();
    }
  } catch (_) { /* Keep the list usable when a detail request fails. */ }
}

function closeDetail() {
  document.body.classList.remove("detail-open");
  state.lastId = null;
  setActive(null);
  $("#idleState").style.display = "";
  $("#detail").hidden = true;
  if (!isWide()) $("#search").focus();
}

function renderChips() {
  const chipData = [["", "All"], ...STAGES.map(stage => [stage, stage])];
  $("#stageChips").innerHTML = chipData.map(([value, label]) => {
    const active = (state.stage || "") === value;
    return `<button class="chip${active ? " active" : ""}" type="button" data-stage="${esc(value)}" aria-pressed="${active}">${esc(label)}</button>`;
  }).join("");
  $("#stageChips").querySelectorAll(".chip").forEach(chip => chip.onclick = () => {
    state.stage = chip.dataset.stage || null;
    renderChips();
    loadItems();
  });
}

function clearFilters() {
  state.q = "";
  state.stage = null;
  $("#search").value = "";
  $("#clearSearch").classList.remove("show");
  renderChips();
  loadItems();
  $("#search").focus();
}

$("#list").addEventListener("click", event => {
  const item = event.target.closest(".item");
  if (item) { openItem(item.dataset.id); return; }
  if (event.target.closest("#clearFilters")) clearFilters();
});

let searchTimer;
$("#search").addEventListener("input", event => {
  clearTimeout(searchTimer);
  searchTimer = setTimeout(() => {
    state.q = event.target.value.trim();
    $("#clearSearch").classList.toggle("show", Boolean(state.q));
    loadItems();
  }, 220);
});

$("#search").addEventListener("keydown", event => {
  if (event.key === "Escape" && event.target.value) {
    event.target.value = "";
    state.q = "";
    $("#clearSearch").classList.remove("show");
    loadItems();
  }
});

$("#clearSearch").onclick = () => {
  $("#search").value = "";
  state.q = "";
  $("#clearSearch").classList.remove("show");
  loadItems();
  $("#search").focus();
};

document.addEventListener("keydown", event => {
  if (event.key === "/" && document.activeElement !== $("#search") && !["INPUT", "TEXTAREA", "SELECT"].includes(document.activeElement.tagName)) {
    event.preventDefault();
    $("#search").focus();
  }
  if (event.key === "Escape" && !isWide() && document.body.classList.contains("detail-open")) closeDetail();
});

const mediaQuery = window.matchMedia("(min-width: 900px)");
mediaQuery.addEventListener("change", () => {
  if (!mediaQuery.matches && state.lastId !== null && !$("#detail").hidden) document.body.classList.add("detail-open");
});

renderChips();
loadTags();
loadItems();
</script>
</body>
</html>
